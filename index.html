<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Victoria Sandwiches de Miga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Lobster&family=Lora:wght@400;600&family=Nunito:wght@400;600;700&family=Pacifico&family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&family=Quicksand:wght@400;600;700&family=Satisfy&display=swap">
<style id="css">
  /* Layout: una columna, marca script arriba, menú, fotos, pedido, barra fija de WhatsApp; panel de administración pegado arriba solo para dueño/admin */
  :root {
    --bg: #fdf3f1;
    --surface: #ffffff;
    --fg: #2b1f23;
    --muted: #6f5a60;
    --line: #f0d4da;
    --pink: #d4457a;
    --pink-soft: #fbe1e8;
    --green: #138659;
    --green-fg: #ffffff;
    --font-script: "Dancing Script", "Brush Script MT", cursive;
    --font-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    --s: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-festa]) {
      --bg: #1c1417; --surface: #271c20; --fg: #f8e9ec; --muted: #c7aab1; --line: #43313a;
      --pink: #f27ca5; --pink-soft: #3a222c; --green: #3fb784; --green-fg: #0d2a1e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"]:not([data-festa]) {
    --bg: #1c1417; --surface: #271c20; --fg: #f8e9ec; --muted: #c7aab1; --line: #43313a;
    --pink: #f27ca5; --pink-soft: #3a222c; --green: #3fb784; --green-fg: #0d2a1e; color-scheme: dark;
  }
  /* Diseños de fiesta: cada uno es una paleta completa */
  :root[data-festa="navidad"]{--bg:#fff5f3;--surface:#fff;--fg:#2a1517;--muted:#6b4a4d;--line:#f0cfd1;--pink:#c0272d;--pink-soft:#fde3e3;--green:#1f6b3a;--green-fg:#fff;color-scheme:light}
  :root[data-festa="anonuevo"]{--bg:#0f1420;--surface:#181f31;--fg:#f5f1e3;--muted:#b6b9c9;--line:#2c3550;--pink:#f2c14e;--pink-soft:#232b45;--green:#e8b93d;--green-fg:#1a1405;color-scheme:dark}
  :root[data-festa="sanvalentin"]{--bg:#fff0f3;--surface:#fff;--fg:#3a1020;--muted:#7d4a5a;--line:#f7c6d2;--pink:#e0245e;--pink-soft:#ffd9e3;--green:#b3123f;--green-fg:#fff;color-scheme:light}
  :root[data-festa="pascua"]{--bg:#f6f3ff;--surface:#fff;--fg:#2a2440;--muted:#645c82;--line:#ddd5f5;--pink:#8a63d2;--pink-soft:#ece4ff;--green:#217a6f;--green-fg:#fff;color-scheme:light}
  :root[data-festa="padre"]{--bg:#eef3f8;--surface:#fff;--fg:#14212e;--muted:#53677a;--line:#cfdce9;--pink:#1f5f99;--pink-soft:#dbe9f6;--green:#1c7a5a;--green-fg:#fff;color-scheme:light}
  :root[data-festa="madre"]{--bg:#fff1f4;--surface:#fff;--fg:#33121f;--muted:#7a4a5c;--line:#f6cad8;--pink:#cf3f78;--pink-soft:#fddbe7;--green:#138659;--green-fg:#fff;color-scheme:light}
  :root[data-festa="amigo"]{--bg:#fff8e6;--surface:#fff;--fg:#2e2310;--muted:#78643f;--line:#f2dfb0;--pink:#d96d00;--pink-soft:#ffe7bd;--green:#0f7f63;--green-fg:#fff;color-scheme:light}
  :root[data-festa="ninez"]{--bg:#effaff;--surface:#fff;--fg:#172a38;--muted:#4f6877;--line:#cfe8f5;--pink:#f0457c;--pink-soft:#d9f1ff;--green:#1b78ad;--green-fg:#fff;color-scheme:light}
  :root[data-festa="primavera"]{--bg:#f3fbef;--surface:#fff;--fg:#1f2d1c;--muted:#566a52;--line:#d8ecd0;--pink:#d6478a;--pink-soft:#e4f6d8;--green:#2f7d2f;--green-fg:#fff;color-scheme:light}
  :root[data-festa="halloween"]{--bg:#17101f;--surface:#221730;--fg:#f6ecff;--muted:#bfa8d6;--line:#3a2a4f;--pink:#ff8a1f;--pink-soft:#2e1f3d;--green:#8bd450;--green-fg:#14210a;color-scheme:dark}

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: calc(15px * var(--s)); line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 96px;
    transition: background .5s, color .5s;
  }
  body::before { content:""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 60; }
  .wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; position: relative; z-index: 1; }
  header { text-align: center; padding-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .brand { font-family: var(--font-script); font-weight: 700; font-size: 4.8em; line-height: 1.05; color: var(--pink); margin: 0; }
  .kind { font-size: .87em; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin: 0; }
  .tag { position: relative; overflow: hidden; display: inline-block; margin-top: 10px; background: var(--green); color: var(--green-fg); font-weight: 600; font-size: .87em; letter-spacing: .08em; text-transform: uppercase; padding: 6px 16px; border-radius: 4px; }
  .tag::after { content:""; position:absolute; inset:0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-120%); animation: sheen 4.5s ease-in-out 1.6s infinite; pointer-events: none; }
  .greet { margin-top: 10px; background: var(--pink-soft); color: var(--fg); border-radius: 999px; padding: 7px 18px; font-weight: 600; font-size: .93em; text-wrap: balance; }
  h2 { font-size: .87em; letter-spacing: .18em; text-transform: uppercase; color: var(--green); margin: 0 0 12px; font-weight: 700; }
  .classic { background: var(--pink-soft); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .classic h3 { margin: 0; font-size: 1.47em; font-weight: 700; text-wrap: balance; }
  .classic p { margin: 0; color: var(--muted); }
  .pill { align-self: flex-start; margin-top: 8px !important; background: var(--green); color: var(--green-fg) !important; font-weight: 600; font-size: .87em; padding: 4px 12px; border-radius: 999px; }
  .classic.off h3, .classic.off p { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .6; }
  .sold { font-style: normal; font-size: .72em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--fg); color: var(--bg); border-radius: 4px; padding: 2px 7px; align-self: flex-start; }
  ul.flavors { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  ul.flavors li { padding: .8em 1.1em; font-weight: 500; font-size: 1.07em; display: flex; align-items: center; gap: 12px; transition: background .2s, transform .2s; }
  ul.flavors li + li { border-top: 1px solid var(--line); }
  ul.flavors li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); flex: none; transition: transform .25s; }
  ul.flavors li:hover { background: var(--pink-soft); transform: translateX(4px); }
  ul.flavors li:hover::before { transform: scale(1.7); }
  ul.flavors li .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  ul.flavors li.off .txt { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .55; }
  ul.flavors li.add { padding: .6em 1.1em; }
  ul.flavors li.add::before { display: none; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 12px; }
  .gallery figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: transform .3s, box-shadow .3s; }
  .gallery figure:hover { transform: translateY(-4px); box-shadow: 0 10px 22px -12px rgba(0,0,0,.35); }
  .gallery .ph { overflow: hidden; }
  .gallery img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .5s; }
  .gallery figure:hover img { transform: scale(1.07); }
  .gallery figcaption { padding: 8px 12px 10px; font-size: .87em; font-weight: 600; }
  .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
  .info > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .info strong { display: block; font-size: 1em; }
  .info span { color: var(--muted); font-size: .93em; display: block; }
  .occasions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .occasions p { margin: 0; width: 100%; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--green); color: var(--green); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: .93em; transition: transform .2s, background .2s, color .2s; }
  .chip:hover { transform: translateY(-3px) rotate(-1.5deg); background: var(--green); color: var(--green-fg); }
  footer { text-align: center; color: var(--muted); font-size: .87em; padding-bottom: 8px; }
  footer b { font-family: var(--font-script); font-size: 1.73em; color: var(--pink); font-weight: 700; }
  .login { margin-top: 14px; background: none; border: 0; color: var(--muted); font: inherit; font-size: .9em; text-decoration: underline; cursor: pointer; padding: 8px; opacity: .8; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); z-index: 20;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bar a { display: flex; flex-direction: column; align-items: center; max-width: 640px; margin-inline: auto; background: var(--green); color: var(--green-fg); text-decoration: none; border-radius: 12px; padding: 11px 16px; font-weight: 700; font-size: 16px; line-height: 1.25; animation: ring 2.8s ease-out 2s infinite; }
  .bar a small { font-weight: 500; font-size: 13px; }
  .bar a:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

  /* Edición */
  .editing [contenteditable] { outline: 1.5px dashed var(--pink); outline-offset: 2px; border-radius: 4px; cursor: text; min-width: 1.5em; display: inline-block; }
  .editing .brand[contenteditable], .editing h1 [contenteditable] { display: inline-block; }
  .editing [contenteditable]:focus { outline: 2px solid var(--pink); background: var(--pink-soft); }
  .editing .classic h3[contenteditable], .editing .classic p[contenteditable], .editing .occasions p[contenteditable], .editing .kind[contenteditable] { display: block; }
  .ctl { display: flex; gap: 6px; flex: none; }
  .mini { min-height: 32px; min-width: 32px; padding: 0 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .mini.hot { border-color: var(--pink); color: var(--pink); }
  .mini.del { color: #c0272d; }
  .panel { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; max-width: 640px; margin: 0 auto 16px; background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 14px 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 24px -14px rgba(0,0,0,.4); }
  .prow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .prow strong { font-size: 13px; }
  .panel label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; min-width: 0; }
  .panel select { font: inherit; font-size: 14px; padding: 7px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); max-width: 100%; }
  .panel summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 4px 0; }
  .panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; padding-top: 6px; align-items: end; }
  .btn { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--green); color: var(--green-fg); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn.alt { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
  .st { font-size: 12px; color: var(--muted); }
  .dlg { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dlg[hidden] { display: none; }
  .dlg .box { background: var(--surface); color: var(--fg); border-radius: 16px; max-width: 420px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); animation: rise .35s both; }
  .dlg h3 { margin: 0; font-family: var(--font-script); font-size: 2em; color: var(--pink); }
  .dlg p { margin: 0; color: var(--muted); font-size: 14px; }
  .dlg .msg { color: var(--fg); font-size: 14px; min-height: 1.5em; }
  .dlg .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .dlg .row .btn { flex: 1 1 140px; }

  /* Fiesta: caída de adornos */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  #fx span { position: absolute; top: -8%; animation: fall linear infinite; opacity: .85; will-change: transform; }

  /* Animaciones de entrada (terminan visibles) */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6) rotate(-4deg); } 60% { transform: scale(1.06) rotate(1deg); } 100% { opacity: 1; transform: none; } }
  @keyframes slide { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  @keyframes sheen { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 14px transparent; } }
  @keyframes fall { 0% { transform: translate3d(0,-10vh,0) rotate(0deg); } 100% { transform: translate3d(var(--dx, 30px),112vh,0) rotate(360deg); } }
  .intro .brand { animation: pop .9s cubic-bezier(.2,.8,.2,1) both; }
  .intro .kind { animation: rise .7s .25s both; }
  .intro .tag { animation: rise .7s .4s both; }
  .intro .greet { animation: rise .7s .55s both; }
  .intro section { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .intro section:nth-of-type(1) { animation-delay: .35s; }
  .intro section:nth-of-type(2) { animation-delay: .5s; }
  .intro section:nth-of-type(3) { animation-delay: .65s; }
  .intro section:nth-of-type(4) { animation-delay: .8s; }
  .intro section:nth-of-type(5) { animation-delay: .95s; }
  .intro ul.flavors li { animation: slide .5s both; animation-delay: calc(.6s + var(--i, 0) * 70ms); }
  .intro footer { animation: rise .7s 1.1s both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #fx { display: none; }
  }
body{margin:0}
img{max-width:100%}
</style>

<script id="code">
(function () {

  ];
  var FD = ['Dancing Script', 'Pacifico', 'Lobster', 'Satisfy', 'Great Vibes', 'Playfair Display'];
  var FB = ['Poppins', 'Nunito', 'Quicksand', 'Lora'];

  function autoTheme() {
    var d = new Date(), m = d.getMonth() + 1, day = d.getDate();
    if (m === 12) return day <= 26 ? 'navidad' : 'anonuevo';
    if (m === 1) return day <= 6 ? 'anonuevo' : 'normal';
    if (m === 2) return day <= 14 ? 'sanvalentin' : 'normal';
    if (m === 3 && day >= 20 || m === 4 && day <= 20) return 'pascua';
    if (m === 6 && day >= 10 && day <= 21) return 'padre';
    if (m === 7 && day >= 10 && day <= 20) return 'amigo';
    if (m === 8 && day >= 10 && day <= 21) return 'ninez';
    if (m === 9 && day >= 15 && day <= 22) return 'primavera';
    if (m === 10) return day <= 21 ? 'madre' : 'halloween';
    return 'normal';
  }
  function themeId() { return S.theme === 'auto' ? autoTheme() : S.theme; }
  function themeObj() { var id = themeId(); for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return THEMES[i]; return THEMES[0]; }

  function ed(k, tag, cls, txt) {
    return '<' + tag + (cls ? ' class="' + cls + '"' : '') + ' data-k="' + k + '"' +

  }
  function setVal(k, v) {
    var p = k.split('.');

    else if (p[0] === 'f') S.flavors[+p[1]].t = v;
    else if (p[0] === 'g') S.gallery[+p[1]].cap = v;
    else if (p[0] === 'i') S.info[+p[1]][p[2]] = v;
    else if (p[0] === 'o') S.occ[+p[1]] = v;
  }
  function waLink() {
    var digits = String(S.t.phone).replace(/\D/g, '');
    return 'https://wa.me/549' + digits + '?text=' + encodeURIComponent('Hola Victoria! Quiero hacer un pedido de sandwiches de miga.');

      h += '<span class="chip">' + ed('o.' + i, 'span', '', o) + (editing ? '<button class="mini del" data-a="do" data-i="' + i + '" aria-label="Borrar">✕</button>' : '') + '</span>';
    });
    if (editing) h += '<span class="chip" style="border-style:dashed"><input id="newo" type="text" placeholder="Nueva ocasión" style="width:130px;font:inherit;font-size:14px;border:0;background:transparent;color:var(--fg)"><button class="mini hot" data-a="ao">+</button></span>';
    h += '</div></section>';

    h += '<footer><b>' + esc(S.t.brand) + '</b><br>' + ed('t.footer', 'span', '', S.t.footer) + '</footer></div>';
    h += '<div class="bar"><a href="' + waLink() + '">Pedir por WhatsApp<small>' + esc(S.t.phone) + '</small></a></div>';
    document.getElementById('app').innerHTML = h;
    fx(th);
    if (first) setTimeout(function () { var w = document.querySelector('.wrap'); if (w) w.classList.remove('intro'); }, 2400);
  }

  var fxKey = '';
  function fx(th) {
    if (fxKey === th.id) return; fxKey = th.id;
    var box = document.getElementById('fx'); box.innerHTML = '';
    if (!th.fx.length) return;
    for (var i = 0; i < 16; i++) {
      var s = document.createElement('span');
      s.textContent = th.fx[i % th.fx.length];
      s.style.left = (Math.random() * 96) + '%';
      s.style.fontSize = (14 + Math.random() * 16) + 'px';
      s.style.animationDuration = (9 + Math.random() * 10) + 's';
      s.style.animationDelay = (-Math.random() * 14) + 's';
      s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      box.appendChild(s);
    }
  }

  function panel() {
    var box = document.getElementById('adm');
    if (!editing) { box.innerHTML = ''; return; }
    var o = '<option value="auto"' + (S.theme === 'auto' ? ' selected' : '') + '>Automático según la fecha</option>';
    THEMES.forEach(function (t) { o += '<option value="' + t.id + '"' + (S.theme === t.id ? ' selected' : '') + '>' + t.name + '</option>'; });
    function opts(list, cur) { return list.map(function (f) { return '<option' + (f === cur ? ' selected' : '') + '>' + f + '</option>'; }).join(''); }
    box.innerHTML = '<div class="panel"><div class="prow"><strong>Editando como ' + role + '</strong><span class="st" id="st">Tocá cualquier texto para escribir.</span></div>' +
      '<div class="prow"><label>Diseño de fiesta<select id="selTheme">' + o + '</select></label>' +
      '<span class="ctl"><button class="btn" data-p="save">Guardar y publicar</button><button class="btn alt" data-p="exit">Salir</button></span></div>' +
      '<details><summary>Letra y tamaño</summary><div class="grid">' +
      '<label>Letra del título<select id="selFd">' + opts(FD, S.fd) + '</select></label>' +
      '<label>Letra del texto<select id="selFb">' + opts(FB, S.fb) + '</select></label>' +
      '<label>Tamaño (' + S.scale + '%)<span class="ctl"><button class="mini" data-p="smaller">A−</button><button class="mini" data-p="bigger">A+</button></span></label>' +
      '</div></details></div>';
  }
  function status(t) { var e = document.getElementById('st'); if (e) e.textContent = t; }

  var app = document.getElementById('app'), adm = document.getElementById('adm');
  app.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (k) { setVal(k, e.target.textContent); if (k === 't.phone') { var l = document.querySelector('.bar a'); if (l) { l.href = waLink(); l.querySelector('small').textContent = S.t.phone; } } }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.hasAttribute('contenteditable')) { e.preventDefault(); e.target.blur(); }
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a'), i = +b.getAttribute('data-i');
    if (a === 'login') return openLogin();
    if (a === 'tc') S.c.off = !S.c.off;
    else if (a === 'tf') S.flavors[i].off = !S.flavors[i].off;
    else if (a === 'df') S.flavors.splice(i, 1);
    else if (a === 'do') S.occ.splice(i, 1);
    else if (a === 'af') { var v = document.getElementById('newf').value.trim(); if (!v) return; S.flavors.push({ t: v, off: false }); }
    else if (a === 'ao') { var w = document.getElementById('newo').value.trim(); if (!w) return; S.occ.push(w); }
    render(false);
  });
  adm.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'selTheme') S.theme = e.target.value;
    else if (id === 'selFd') S.fd = e.target.value;
    else if (id === 'selFb') S.fb = e.target.value;
    else return;
    render(false);
  });
  adm.addEventListener('click', function (e) {
    var b = e.target.closest('[data-p]'); if (!b) return;
    var p = b.getAttribute('data-p');
    if (p === 'smaller' || p === 'bigger') { S.scale = Math.max(80, Math.min(130, S.scale + (p === 'bigger' ? 5 : -5))); render(false); panel(); }
    else if (p === 'exit') { editing = false; panel(); render(false); }
    else if (p === 'save') save();
  });

  function buildDoc() {
    var css = document.getElementById('css').textContent, code = document.getElementById('code').textContent;
    var json = JSON.stringify(S).replace(/</g, '\\u003c');
    var link = document.querySelector('link[rel="stylesheet"]').href;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>' +
      '<title>Victoria Sandwiches de Miga</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="' + link + '">\n' +
      '<style id="css">' + css + '</style>\n<div id="adm"></div>\n<div id="app"></div>\n<div id="fx" aria-hidden="true"></div>\n<div class="dlg" id="dlg" hidden></div>\n' +
      '<script id="state" type="application/json">' + json + '<\/script>\n<script id="code">' + code + '<\/script></body></html>';
  }
  async function save() {
    status('Guardando…');
    try {
      var a = window.claude && await window.claude.use('artifact');
      if (!a) throw { code: 'not_granted' };
      await a.publish(buildDoc());
      status('Publicado. Recargando…');
    } catch (err) {
      var c = err && err.code;
      if (c === 'conflict') status('Alguien publicó antes. Se carga la última versión.');
      else if (c === 'not_writer' || c === 'not_granted') status('Esta cuenta puede ver la página pero no guardar cambios.');
      else if (c === 'too_large') status('La página es demasiado grande para guardar.');
      else status('No se pudo guardar. Probá de nuevo en un momento.');
    }
  }

  function openLogin() {
    var d = document.getElementById('dlg'); d.hidden = false;
    d.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-labelledby="lt"><h3 id="lt">Acceso</h3>' +
      '<p>Solo el dueño y los administradores pueden cambiar textos, letras, tachar lo que no hay y elegir el diseño de la fiesta.</p>' +
      '<div class="row"><button class="btn" data-l="dueño">Soy el dueño</button><button class="btn" data-l="administrador">Soy administrador</button></div>' +
      '<div class="msg" id="lm" role="status"></div><div class="row"><button class="btn alt" data-l="close">Cerrar</button></div></div>';
  }
  document.getElementById('dlg').addEventListener('click', async function (e) {
    var b = e.target.closest('[data-l]');
    if (!b && e.target.id === 'dlg') { this.hidden = true; return; }
    if (!b) return;
    var want = b.getAttribute('data-l'), m = document.getElementById('lm');
    if (want === 'close') { this.hidden = true; return; }
    m.textContent = 'Verificando tu cuenta…';
    var u = null;
    try { u = window.claude && await window.claude.use('user'); } catch (x) { u = null; }
    if (!u) { m.textContent = 'No pude verificar tu cuenta. Abrí esta página con la sesión de Claude del dueño o de un administrador.'; return; }
    var own = u.isOwner(), can = u.canEdit();
    if (!own && !can) { m.textContent = 'Esta cuenta no tiene permiso de edición. El dueño puede darte acceso desde Compartir, con permiso para editar.'; return; }
    if (want === 'dueño' && !own) { m.textContent = 'Esta cuenta es de administrador, no del dueño. Entrá como administrador.'; return; }
    if (want === 'administrador' && own) { m.textContent = 'Esta cuenta es la del dueño. Entrá como dueño.'; return; }
    role = own ? 'dueño' : 'administrador';
    editing = true; this.hidden = true; panel(); render(false);
    window.scrollTo(0, 0);
  });

  render(true);
})();
</script>

</body></html>
